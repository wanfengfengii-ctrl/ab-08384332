name: turnpike-workbench

services:
  web:
    build: .
    image: turnpike-workbench:latest
    ports:
      # 宿主机端口可通过环境变量 WEB_PORT 配置，默认 8080
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
