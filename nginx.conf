server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 健康检查端点（Docker HEALTHCHECK 与 compose healthcheck 共用）
  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  # 静态资源缓存
  location ~* \.(?:js|css|svg|png|jpg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA 回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
